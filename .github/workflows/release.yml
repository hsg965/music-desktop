# 推送 v* 标签 或 手动触发 → 打包 Windows / macOS → 发布到 GitHub Releases
#
# 用法：
# 1. 修改 package.json 与 src-tauri/tauri.conf.json 中的 version
# 2. git tag v0.1.0 && git push origin v0.1.0
# 3. 在 Actions 中查看构建；完成后到 Releases 下载安装包
#
# 也可在 GitHub → Actions → Release → Run workflow 手动触发
#
# macOS：在 macos-latest（Apple Silicon）上交叉编译 universal 包
# （aarch64 + x86_64 合一），不再依赖已稀缺的 macos-13 Intel runner。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "创建为草稿 Release（不立即公开）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          # Apple Silicon runner 上交叉编译 Intel + ARM → 单个 universal .dmg/.app
          - name: macos-universal
            platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri & upload Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用于生成 .sig 与 latest.json，使客户端可自动更新
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # 版本号取自 tauri.conf.json，__VERSION__ 会被替换为实际版本
          tagName: v__VERSION__
          releaseName: "Music Desktop v__VERSION__"
          releaseBody: |
            ## Music Desktop

            在线音乐桌面播放器（Tauri + Vue3）。

            ### 下载说明
            | 系统 | 文件 |
            |------|------|
            | Windows x64 | `.exe`（NSIS 安装包）或 `.msi` |
            | macOS（Intel + Apple Silicon） | `universal` 通用包 `.dmg` / `.app.tar.gz` |

            > **macOS 未签名提示**：若提示「无法打开」→ 系统设置 → 隐私与安全性 → 仍要打开。

            ### 说明
            - 音源 API 仅供学习研究，禁止商用。
            - 详细变更见本次 tag 对应提交记录。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.args }}
